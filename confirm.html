<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <title>Підтвердити отримання</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="stylesheet" href="styles.css?v=20260826d">
  <style>
    /* Сторінка-одинак: та сама скляна мова, лише центрована картка */
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    .confirm-card {
      width: 100%;
      max-width: 520px;
      padding: 26px 26px 22px;
      animation: panelIn .5s var(--spring);
    }
    .title { margin: 12px 0 4px; font-size: 21px; font-weight: 700; letter-spacing: -.02em; }
    .row { font-size: 14px; color: var(--ink-soft); }
    .muted { color: var(--ink-soft); font-size: 13px; margin-top: 10px; min-height: 18px; }
    .btn-wrap { margin-top: 20px; display: flex; justify-content: center; }
    .btn-confirm { min-width: 230px; justify-content: center; padding: 11px 18px; font-size: 14px; border-radius: 13px; }
  </style>
</head>
<body>
  <div class="glass-card confirm-card">
    <div class="badge badge-indigo">Підтвердження отримання</div>
    <div id="title" class="title"></div>
    <div id="info" class="row"></div>
    <div id="res" class="muted"></div>
    <div class="btn-wrap">
      <button class="gbtn gbtn-emerald btn-confirm" id="confirm">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M20 6 9 17l-5-5"/>
        </svg>
        Підтвердити
      </button>
    </div>
  </div>

  <script>
    const params = new URLSearchParams(location.search);
    const status   = 'received'; // бек очікує, але користувачу не показуємо
    const supplier = params.get('supplier') || 'Невідомий постачальник';
    const orderDate = params.get('date') || params.get('orderDate') || '';
    const idsRaw = params.getAll('ids[]').length ? params.getAll('ids[]') :
                (params.get('ids') ? params.get('ids').split(',') : []);
    const ids = idsRaw
      .map(x => Number(x))
      .filter(n => !Number.isNaN(n));

    document.getElementById('title').textContent = supplier;
    const dateLabel = orderDate ? ` · Дата замовлення: ${orderDate}` : '';
    document.getElementById('info').textContent  = `Позицій: ${ids.length}${dateLabel}`;

    document.getElementById('confirm').onclick = async () => {
      const resBox = document.getElementById('res');
      resBox.textContent = 'Відправляю...';
      const payload = ids.map(id => ({ id, procurement_status: status }));
      try {
        const resp = await fetch('https://primary-production-eeb3.up.railway.app/webhook/26cb3bb4-e19f-4037-8291-6525da83be45', {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        const text = await resp.text();
        resBox.textContent = resp.ok ? 'Запит успішно відправлений' : 'Помилка: ' + resp.status + ' ' + text;
      } catch (e) {
        resBox.textContent = 'Помилка відправки: ' + e;
      }
    };
  </script>
</body>
</html>
